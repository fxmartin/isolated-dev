name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    # Apple silicon: the artifact is a darwin/arm64 binary and the release
    # script executes it to verify the version it was stamped with.
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Check out the source being released
        uses: actions/checkout@v4
        with:
          # The version falls back to `git describe`, which needs the tags.
          fetch-depth: 0

      - name: Install the Go toolchain the module declares
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Runs the Go test suite and then builds, verifies, and packages the
      # artifact. Host-backed tests need Apple Container and stay skipped here.
      - name: Test, build, and package the release artifact
        env:
          ISOLATED_DEV_VERSION: ${{ inputs.version || github.ref_name }}
        run: scripts/release.sh

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: isolated-dev-darwin-arm64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

      - name: Attach the artifact to the tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          dist/isolated-dev-*.tar.gz
          dist/isolated-dev-*.tar.gz.sha256
          --title "$GITHUB_REF_NAME"
          --generate-notes
